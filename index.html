<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>睡眠サイクル計算機</title>
  <style>
    :root {
      color: #2e2233;
      background: #f3e8ef;
      font-family: system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: #f3e8ef;
    }

    main {
      width: min(100% - 32px, 560px);
      margin: 0 auto;
      padding: 24px 0;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 18px;
      line-height: 1.4;
    }

    .lead {
      margin: 0 0 24px;
      color: #6b5d6e;
      font-size: 14px;
      line-height: 1.6;
    }

    .calculator {
      display: grid;
      gap: 16px;
    }

    .mode-group,
    .field-group {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      border: 0;
    }

    legend,
    .field-label {
      color: #6b5d6e;
      font-size: 14px;
    }

    .choice,
    .option {
      display: flex;
      align-items: center;
      min-height: 44px;
      gap: 8px;
      padding: 8px;
      border: 1px solid #e4d5de;
      border-radius: 6px;
      background: #fff;
      color: #2e2233;
      font-size: 16px;
      line-height: 1.4;
      cursor: pointer;
    }

    .choice:has(input:checked) {
      border-color: #5b4b8a;
      color: #5b4b8a;
      font-weight: 600;
    }

    input[type="radio"],
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: #5b4b8a;
      flex: 0 0 auto;
    }

    input[type="time"] {
      width: 100%;
      min-height: 44px;
      padding: 8px;
      border: 1px solid #e4d5de;
      border-radius: 6px;
      background: #fff;
      color: #2e2233;
      font: inherit;
      font-size: 16px;
    }

    input[type="time"]:focus-visible,
    button:focus-visible,
    .choice:has(input:focus-visible),
    .option:has(input:focus-visible) {
      outline: 3px solid #5b4b8a;
      outline-offset: 2px;
    }

    .results {
      display: grid;
      gap: 8px;
      padding: 8px;
      border: 1px solid #e4d5de;
      border-radius: 6px;
      background: #fff;
    }

    .result-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px;
      padding: 8px;
      border-bottom: 1px solid #e4d5de;
    }

    .result-row:last-child { border-bottom: 0; }

    .result-time {
      color: #5b4b8a;
      font-size: 22px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1.3;
    }

    .result-detail {
      color: #6b5d6e;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      margin: 0;
      color: #d93025;
      font-size: 14px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      min-height: 44px;
      border: 1px solid #5b4b8a;
      border-radius: 6px;
      background: #fff;
      color: #5b4b8a;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: #f3e8ef; }
  /* --- 運営者表記フッタ（全Day共通・Day037と同一仕様） -------------------
     ページごとに配色が違うため、ページ側のCSS変数に依存せず自己完結させる。
     ツール本体のスタイルには触れない。印刷時は表示しない。 */
  .mw-footer {
    box-sizing: border-box;
    width: 100%;
    max-width: 100%;
    margin: 24px 0 0;
    padding: 16px;
    background: #F7F7F8;
    border: 1px solid #D8D8DC;
    border-radius: 6px;
    color: #3A3A3E;
    font-family: system-ui, sans-serif;
    font-size: 12px;
    font-weight: 400;
    line-height: 1.7;
    text-align: left;
    overflow-wrap: anywhere;
  }
  .mw-footer p { margin: 0 0 6px; padding: 0; color: #3A3A3E; font-size: 12px; font-weight: 400; line-height: 1.7; text-align: left; }
  .mw-footer p:last-child { margin-bottom: 0; }
  .mw-footer a { color: #0B5AA6; }
  .mw-footer.mw-footer--page { width: calc(100% - 32px); max-width: 720px; margin: 24px auto; }
  @media print { .mw-footer { display: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>睡眠サイクル計算機</h1>
      <p class="lead">就寝・起床の時刻を入れると、90分周期で気持ちよく起きられる時刻がわかります</p>
    </header>

    <section class="calculator" aria-label="睡眠サイクルの計算">
      <fieldset class="mode-group">
        <legend>計算方法</legend>
        <label class="choice">
          <input type="radio" name="mode" value="sleep" checked>
          就寝時刻から起きる時刻を計算
        </label>
        <label class="choice">
          <input type="radio" name="mode" value="wake">
          起きたい時刻から寝る時刻を計算
        </label>
      </fieldset>

      <div class="field-group">
        <label class="field-label" for="time-input" id="time-label">就寝時刻</label>
        <input id="time-input" type="time" aria-describedby="time-label">
      </div>

      <label class="option">
        <input id="settle-option" type="checkbox">
        寝つくまで15分を加算
      </label>

      <div id="result-area" aria-live="polite"></div>

      <button id="clear-button" type="button">クリア</button>
    </section>
  <footer class="mw-footer">
    <p>みちAIワークス（MICHI AI WORKS）／代表 田中　泉</p>
    <p>運営: <a href="https://michi-portfolio.vercel.app/" rel="noopener">みちAIワークス 公式サイト</a>（https://michi-portfolio.vercel.app/ ）／ お問い合わせ: <a href="mailto:nncf123nncf@gmail.com">nncf123nncf@gmail.com</a></p>
    <p>このツールはブラウザの中だけで動きます。入力した内容は外部に送信しません。</p>
    <p>ログイン・会員登録・パスワードの入力を求めることはありません。</p>
  </footer>
  </main>

  <script>
    (() => {
      const cycles = [3, 4, 5, 6];
      const cycleMinutes = 90;
      const timeInput = document.querySelector('#time-input');
      const option = document.querySelector('#settle-option');
      const resultArea = document.querySelector('#result-area');
      const timeLabel = document.querySelector('#time-label');
      const modeInputs = [...document.querySelectorAll('input[name="mode"]')];
      const clearButton = document.querySelector('#clear-button');

      const formatTime = (minutes) => {
        const normalized = ((minutes % 1440) + 1440) % 1440;
        const hours = Math.floor(normalized / 60);
        const mins = normalized % 60;
        return `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
      };

      const durationLabel = (cycle) => `${cycle * 1.5}時間・${cycle}サイクル`;

      const selectedMode = () => modeInputs.find((input) => input.checked).value;

      const render = () => {
        const mode = selectedMode();
        timeLabel.textContent = mode === 'sleep' ? '就寝時刻' : '起きたい時刻';

        if (!timeInput.value) {
          resultArea.innerHTML = '<p class="error">時刻を入力してください</p>';
          return;
        }

        const [hours, minutes] = timeInput.value.split(':').map(Number);
        const inputMinutes = hours * 60 + minutes;
        const settleMinutes = option.checked ? 15 : 0;
        const rows = cycles.map((cycle) => {
          const cycleTotal = cycle * cycleMinutes;
          const candidate = mode === 'sleep'
            ? inputMinutes + settleMinutes + cycleTotal
            : inputMinutes - cycleTotal - settleMinutes;
          return `<div class="result-row"><span class="result-time">${formatTime(candidate)}</span><span class="result-detail">${durationLabel(cycle)}</span></div>`;
        }).join('');
        resultArea.innerHTML = `<div class="results" aria-label="計算結果">${rows}</div>`;
      };

      modeInputs.forEach((input) => input.addEventListener('change', render));
      timeInput.addEventListener('input', render);
      timeInput.addEventListener('change', render);
      option.addEventListener('change', render);
      clearButton.addEventListener('click', () => {
        timeInput.value = '';
        option.checked = false;
        modeInputs[0].checked = true;
        render();
        timeInput.focus();
      });

      render();
    })();
  </script>
</body>
</html>
